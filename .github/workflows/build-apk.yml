name: Build AlfaSputnik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q mapp-project.zip -d project

      - name: Add Android-side diagnostics
        working-directory: project
        run: |
          cat > app/src/main/java/ru/alfanomy/mapp/MainActivity.java <<'EOF'
          package ru.alfanomy.mapp;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.ViewGroup;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextView diagnostics;

              @SuppressLint("SetJavaScriptEnabled")
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  diagnostics = new TextView(this);
                  diagnostics.setTextColor(Color.WHITE);
                  diagnostics.setTextSize(11);
                  diagnostics.setBackgroundColor(0xCC000000);
                  diagnostics.setPadding(8, 4, 8, 4);
                  diagnostics.setText("DIAG: запуск");

                  FrameLayout.LayoutParams webLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  FrameLayout.LayoutParams diagLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  diagLp.gravity = android.view.Gravity.BOTTOM;

                  root.addView(webView, webLp);
                  root.addView(diagnostics, diagLp);
                  setContentView(root);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String u = request.getUrl().toString();
                          if (u.contains("server/index.jss") || u.contains("mapp-1.2/server")) {
                              showDiag("HTTP: " + request.getMethod() + " " + u);
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onConsoleMessage(ConsoleMessage m) {
                          String msg = m.message();
                          if (msg != null && (msg.contains("update") || msg.contains("Update") || msg.contains("session") || msg.contains("connection"))) {
                              showDiag("JS: " + msg);
                          }
                          return true;
                      }
                  });

                  WebView.setWebContentsDebuggingEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void showDiag(final String text) {
                  runOnUiThread(() -> diagnostics.setText("DIAG: " + text));
              }

              @Override public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
