name: Build AlfaSputnik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q mapp-project.zip -d project

      - name: Add Android response diagnostic
        working-directory: project
        run: |
          cat > app/src/main/java/ru/alfanomy/mapp/MainActivity.java <<'EOF'
          package ru.alfanomy.mapp;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextView diagnostics;

              @SuppressLint("SetJavaScriptEnabled")
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  diagnostics = new TextView(this);
                  diagnostics.setTextColor(Color.WHITE);
                  diagnostics.setTextSize(11);
                  diagnostics.setBackgroundColor(0xCC000000);
                  diagnostics.setPadding(8, 4, 8, 4);
                  diagnostics.setText("DIAG: запуск");

                  root.addView(webView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  FrameLayout.LayoutParams dl = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  dl.gravity = android.view.Gravity.BOTTOM;
                  root.addView(diagnostics, dl);
                  setContentView(root);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String u = request.getUrl().toString();
                          if (u.contains("name=update") && (u.contains("server/index.jss") || u.contains("mapp-1.2/server"))) {
                              showDiag("UPDATE: запрос");
                              try {
                                  URL url = new URL(u);
                                  HttpURLConnection c = (HttpURLConnection) url.openConnection();
                                  c.setConnectTimeout(20000);
                                  c.setReadTimeout(120000);
                                  c.setRequestMethod(request.getMethod());
                                  c.setRequestProperty("Accept-Encoding", "identity");
                                  c.setRequestProperty("User-Agent", webView.getSettings().getUserAgentString());
                                  String cookie = CookieManager.getInstance().getCookie(u);
                                  if (cookie != null) c.setRequestProperty("Cookie", cookie);
                                  for (Map.Entry<String,String> h : request.getRequestHeaders().entrySet()) {
                                      String k = h.getKey();
                                      if (!"Cookie".equalsIgnoreCase(k) && !"Accept-Encoding".equalsIgnoreCase(k) && !"Host".equalsIgnoreCase(k)) {
                                          c.setRequestProperty(k, h.getValue());
                                      }
                                  }
                                  int code = c.getResponseCode();
                                  InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                                  byte[] body = readAll(in);
                                  String ct = c.getContentType();
                                  if (ct == null) ct = "application/javascript; charset=UTF-8";
                                  showDiag("UPDATE: HTTP " + code + " / " + body.length + " bytes");
                                  String text = new String(body, "UTF-8");
                                  int p = text.indexOf("signalStreams");
                                  int e = text.indexOf("error");
                                  showDiag("UPDATE: HTTP " + code + " / " + body.length + " bytes / signalStreams=" + (p >= 0) + " / error=" + (e >= 0));
                                  return new WebResourceResponse("application/javascript", "UTF-8", code, c.getResponseMessage(), "", new ByteArrayInputStream(body));
                              } catch (Exception ex) {
                                  showDiag("UPDATE: ERROR " + ex.getClass().getSimpleName() + ": " + ex.getMessage());
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  WebView.setWebContentsDebuggingEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private byte[] readAll(InputStream in) throws Exception {
                  if (in == null) return new byte[0];
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] b = new byte[8192];
                  int n;
                  while ((n = in.read(b)) != -1) out.write(b, 0, n);
                  in.close();
                  return out.toByteArray();
              }

              private void showDiag(final String text) {
                  runOnUiThread(() -> diagnostics.setText("DIAG: " + text));
              }

              @Override public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
